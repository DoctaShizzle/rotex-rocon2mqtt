        card_mod:
          style: >
            ha-card { container-type: inline-size; max-width: 740px; margin: 0
            auto; border: none; background: white; }

            @keyframes pump-centered { from { transform: translate(-50%, -50%)
            rotate(0deg); } to { transform: translate(-50%, -50%)
            rotate(360deg); } }

            @keyframes demo-pump { 0%, 10% { transform: translate(-50%, -50%)
            rotate(0deg); } 100% { transform: translate(-50%, -50%)
            rotate(5760deg); } }

            @keyframes demo-dhw { 0%, 30%, 90%, 100% { left: 26%; } 40%, 55% {
            left: 28%; } 65%, 80% { left: 27%; } }

            @keyframes demo-bp { 0%, 30% { left: 60%; } 40%, 55%, 90%, 100% {
            left: 62%; } 65%, 80% { left: 61%; } }

            @keyframes demo-common { 0%, 10%, 100% { opacity: 0; } 15%, 95% {
            opacity: 1; } }

            @keyframes demo-ch { 0%, 10%, 40%, 55%, 100% { opacity: 0; } 15%,
            30%, 90%, 95% { opacity: 1; } 65%, 80% { opacity: .5; } }

            @keyframes demo-tank { 0%, 30%, 90%, 100% { opacity: 0; } 40%, 55% {
            opacity: 1; } 65%, 80% { opacity: .5; } }

            @keyframes demo-heating { 0%, 10%, 40%, 55%, 90%, 100% { opacity: 0;
            } 15%, 30% { opacity: 1; } 65%, 80% { opacity: .5; } }

            @keyframes demo-bypass { 0%, 30%, 100% { opacity: 0; } 40%, 55%,
            90%, 95% { opacity: 1; } 65%, 80% { opacity: .5; } }

            @keyframes demo-hot { 0%, 55%, 100% { opacity: 0; } 65%, 80% {
            opacity: .25; } 90%, 95% { opacity: 1; } }

            @keyframes demo-cool-ch { 0%, 55%, 90%, 100% { opacity: 0; } 65%,
            80% { opacity: .25; } }

            @keyframes demo-cool-bypass { 0%, 30%, 90%, 100% { opacity: 0; }
            40%, 55% { opacity: 1; } 65%, 80% { opacity: .25; } }

            {% set automatic =
            is_state('input_boolean.warmtepomp_test_automatisch', 'on') %}

            {% set pump = is_state('input_boolean.warmtepomp_test_pomp', 'on')
            %}

            {% set d = ([0, [states('input_number.warmtepomp_test_dhw') |
            float(0), 100] | min] | max) / 100 %}

            {% set b = ([0, [states('input_number.warmtepomp_test_bypass') |
            float(0), 100] | min] | max) / 100 %}

            :host {
              --dhw-position: {{ 26 + 2 * d }}%;
              --bypass-position: {{ 60 + 2 * b }}%;
              --pump-state: {{ 'running' if automatic or pump else 'paused' }};
              --pump-animation: {{ 'demo-pump 32s linear infinite' if automatic else 'pump-centered 1.5s linear infinite' }};
              --dhw-animation: {{ 'demo-dhw 32s linear infinite' if automatic else 'none' }};
              --bypass-animation: {{ 'demo-bp 32s linear infinite' if automatic else 'none' }};
              --label-dhw-animation: {{ 'sim-dhw-label 32s steps(1, end) infinite' if automatic else 'none' }};
              --label-bp-animation: {{ 'sim-bp-label 32s steps(1, end) infinite' if automatic else 'none' }};
              --flow-common: {{ 1 if pump else 0 }};
              --flow-dhw-ch: {{ 1 - d if pump else 0 }};
              --flow-dhw-tank: {{ d if pump else 0 }};
              --flow-heating: {{ 1 - b if pump else 0 }};
              --flow-bypass: {{ b if pump else 0 }};
              --flow-common-hot: {{ b * (1 - d) if pump else 0 }};
              --flow-heating-cool: {{ d * (1 - b) if pump else 0 }};
              --flow-bypass-cool: {{ d * b if pump else 0 }};
              --test-common: {{ 'demo-common 32s linear infinite' if automatic else 'none' }};
              --test-dhw-ch: {{ 'demo-ch 32s linear infinite' if automatic else 'none' }};
              --test-dhw-tank: {{ 'demo-tank 32s linear infinite' if automatic else 'none' }};
              --test-heating: {{ 'demo-heating 32s linear infinite' if automatic else 'none' }};
              --test-bypass: {{ 'demo-bypass 32s linear infinite' if automatic else 'none' }};
              --test-common-hot: {{ 'demo-hot 32s linear infinite' if automatic else 'none' }};
              --test-heating-cool: {{ 'demo-cool-ch 32s linear infinite' if automatic else 'none' }};
              --test-bypass-cool: {{ 'demo-cool-bypass 32s linear infinite' if automatic else 'none' }};
            }

            hui-state-label-element:nth-of-type(-n+2) { font-size: 0 !important;
            visibility: hidden !important; }

            hui-state-label-element:nth-of-type(-n+2)::after { position:
            absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            visibility: visible; white-space: nowrap; font-size: clamp(10px,
            2.4vw, 17px); color: #183d53; background: #fafbfc; padding: 1px 3px;
            font-weight: 600; }

            hui-state-label-element:nth-of-type(1)::after { content: "{{ (d *
            100) | round(0) | int }}%"; animation: var(--label-dhw-animation,
            none); }

            hui-state-label-element:nth-of-type(2)::after { content: "{{ (b *
            100) | round(0) | int }}%"; animation: var(--label-bp-animation,
            none); }

