            hui-state-label-element:nth-of-type(-n+2)::after { padding: 4px 7px
            !important; line-height: 1.15 !important; border: 1.5px solid
            #2586a4; border-radius: 6px; background: #e7f4f8; color: #11566f;
            font-size: clamp(11px, 2.2vw, 18px); font-weight: 700; white-space:
            nowrap; }

            hui-state-label-element:nth-of-type(-n+2)::before { position:
            absolute; bottom: calc(100% + 4px); left: 0; width: max-content;
            padding: 0 19px 0 0; font-family: Arial, sans-serif; font-size:
            clamp(10px, 1.6vw, 14px); line-height: 1.15; font-weight: 600;
            color: #147b9d; background-color: #fafbfc; background-size: 15px
            15px; background-position: right center; background-repeat:
            no-repeat; visibility: visible; bottom: calc(50% + 20px); left: 50%;
            background-image:
            url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Ccircle%20cx%3D%228%22%20cy%3D%228%22%20r%3D%223.5%22%20fill%3D%22%2389949c%22%2F%3E%3C%2Fsvg%3E");
            }

            hui-state-label-element:nth-of-type(1)::before { content: "SIM DHW";
            }

            hui-state-label-element:nth-of-type(2)::before { content: "SIM
            Bypass"; }

            hui-state-label-element:nth-of-type(-n+2) { display: inline-grid;
            grid-template-columns: max-content; gap: 4px; padding: 0 !important;
            }

            hui-state-label-element:nth-of-type(-n+2)::before,
            hui-state-label-element:nth-of-type(-n+2)::after { position: static;
            transform: none; }

            hui-state-label-element:nth-of-type(-n+2)::after { width:
            fit-content; } @keyframes upm3-demo-running { 0%, 10%, 100% {
            opacity: 0; } 10.01%, 99.99% { opacity: 1; } } @keyframes
            upm3-demo-static { 0%, 10%, 100% { opacity: 1; } 10.01%, 99.99% {
            opacity: 0; } } {% set upm3_auto =
            is_state('input_boolean.warmtepomp_test_automatisch', 'on') %} {%
            set upm3_on = is_state('input_boolean.warmtepomp_test_pomp', 'on')
            %} :host {
              --upm3-running: {{ 1 if upm3_on else 0 }};
              --upm3-static: {{ 0 if upm3_on else 1 }};
              --upm3-running-animation: {{ 'upm3-demo-running 32s linear infinite' if upm3_auto else 'none' }};
              --upm3-static-animation: {{ 'upm3-demo-static 32s linear infinite' if upm3_auto else 'none' }};
            }

            hui-state-label-element:nth-of-type(-n+2) { visibility: visible
            !important; display: flex; flex-direction: column; align-items:
            stretch; box-sizing: border-box; font-family: Arial, sans-serif;
            font-size: clamp(5px, 1.65cqw, 13px) !important; line-height: 1.25;
            gap: .15em; padding: .25em 1.05em .25em .3em !important;
            background-color: #e7f4f8; border: 1.5px solid #2586a4;
            border-radius: 6px; background-image:
            url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Ccircle%20cx%3D%228%22%20cy%3D%228%22%20r%3D%223.5%22%20fill%3D%22%2389949c%22%2F%3E%3C%2Fsvg%3E");
            background-size: .6em .6em; background-position: right .3em center;
            background-repeat: no-repeat; }
            hui-state-label-element:nth-of-type(-n+2)::before { position: static
            !important; transform: none !important; visibility: visible; width:
            100%; padding: 0 !important; margin: 0; font-family: Arial,
            sans-serif; font-size: .82em; line-height: 1.25; text-align: center;
            color: #147b9d; background: none !important; }
            hui-state-label-element:nth-of-type(1)::before { content: "DHW"; }
            hui-state-label-element:nth-of-type(2)::before { content: "Bypass";
            } hui-state-label-element:nth-of-type(-n+2)::after { position:
            static !important; transform: none !important; visibility: visible;
            width: 100% !important; padding: 0 !important; margin: 0;
            font-family: Arial, sans-serif; font-size: inherit; line-height:
            1.25 !important; text-align: center; border: 0; border-radius: 0;
            color: #11566f; background: none !important; }
      - type: entities
        title: Simulatiebediening
        show_header_toggle: false
        entities:
          - entity: input_boolean.warmtepomp_test_automatisch
            name: Automatische cyclus
          - type: section
            label: Cyclus uit = handbediening (alleen testwaarden)
          - entity: input_boolean.warmtepomp_test_pomp
            name: Pomp aan / uit
          - entity: input_number.warmtepomp_test_dhw
            name: DHW (%)
          - entity: input_number.warmtepomp_test_bypass
            name: Bypass (%)
        card_mod:
          style: >
            ha-card { container-type: inline-size; max-width: 740px; margin: 0
            auto; }
