                          }
                          static thermalEvents(histories, periodStart, periodEnd) {
          const prefix='sensor.rocon_heatgenerator_0_';
          const keys=['heater_temperature_actual','tvbh_1','tr','buffer_temperature_actual','valve_ch_dhw','valve_ch_bypass'];
