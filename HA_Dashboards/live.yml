                          normalize(groups,ids){return ids.reduce((out,id,i)=>{const group=groups.find(g=>g.some(r=>r.entity_id===id))||[];out[id]=group.map(r=>({time:(typeof(r.last_changed??r.last_updated)==='number'?(r.last_changed??r.last_updated)*((r.last_changed??r.last_updated)<1e12?1000:1):Date.parse(r.last_changed||r.last_updated)),state:r.state,attributes:r.attributes})).filter(r=>Number.isFinite(r.time)).sort((a,b)=>a.time-b.time);return out;},{});}
