                          async mount(){this._mounted=true;this.shadowRoot.innerHTML='<style>:host{display:block;max-width:740px;margin:auto;color:var(--primary-text-color,#183d53);font-family:Arial,sans-serif}.mode{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;background:#e7f4f8;border:1px solid #b9d9e3;border-radius:9px;color:#11566f}.mode.history{background:#fff2cf;border-color:#e4c16c;color:#77551b}.events{margin:14px 0 30px;padding:18px;border:1px solid #cbdce2;border-radius:12px;background:var(--card-background-color,#fff)}h2{font-size:19px;margin:0 0 7px}.sub,.status{font-size:13px;line-height:1.5;color:var(--secondary-text-color,#58717b)}.toolbar{display:flex;gap:9px;margin:12px 0;flex-wrap:wrap}button,input{font:inherit}button{padding:8px 12px;border:1px solid #9bc4d3;background:#e7f4f8;color:#11566f;border-radius:7px;cursor:pointer}button:disabled{opacity:.5;cursor:default}details{border-top:1px solid #dce7eb;padding:12px 0}summary{cursor:pointer;list-style:none;display:flex;gap:10px;justify-content:space-between;font-size:14px;line-height:1.5}summary::-webkit-details-marker{display:none}.duration{color:#147b9d;white-space:nowrap}.controls{padding-top:12px}input[type=range]{display:block;width:100%;accent-color:#147b9d;margin:15px 0}.limits{display:flex;justify-content:space-between;font-size:12px;color:#58717b}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:11px}input[type=datetime-local]{max-width:100%;box-sizing:border-box;padding:7px;border:1px solid #9bc4d3;border-radius:6px;background:var(--card-background-color,#fff);color:inherit}.selection{font-size:13px;color:#77551b}.current{margin:10px 0;padding:9px;background:#edf7ef;border-radius:7px;color:#27653a;font-size:13px}[hidden]{display:none!important}</style><div class="mode"><span id="modeText">● Live</span><button id="live" hidden>Naar live</button></div><div id="diagram"></div><section class="events"><h2>Laatste 5 events</h2><div class="sub">Afgeleid uit temperatuurstijgingen en klepstanden. Namen, tijdgrenzen en stroming zijn indicatief; n en V worden niet gebruikt.</div><div class="toolbar"><button id="refresh">Vernieuwen</button><button id="older" hidden>Verder terugzoeken</button></div><div id="current" class="current" hidden></div><div id="status" class="status" role="status"></div><div id="list"></div><details><summary>Gebruikte gegevens en detectieregels</summary><div id="quality" class="sub"></div><p class="sub">DHW: stijging van de vattemperatuur en/of verwarmingswater met DHW-klep ≥ 80%. Woning: opwarmend water met beide kleppen ≤ 20%. Bypass: opwarmend water met bypass ≥ 80%. Tussenstanden krijgen Gemengd; onbekende standen blijven onzeker.</p><p class="sub">Drempels: 0,5 °C voor aanvoer of 0,3 °C voor vat/retour binnen 10 minuten; aanvoer warmer dan retour. Signalen met dezelfde route binnen 15 minuten vormen één periode, met 5 minuten naloop. Begin en einde zijn schattingen, geen vastgestelde pompstarts of pompstops.</p></details><div class="sub">Alleen bestaande Home Assistant-historiek · geen aparte opslag · ontbrekende waarden worden als onbekend getoond.</div></section>';
