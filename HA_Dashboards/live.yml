      - sensor.rocon_heatgenerator_0_valve_ch_bypass
      - sensor.rocon_heatgenerator_0_tr
      - sensor.rocon_heatgenerator_0_heater_temperature_actual
      - sensor.rocon_heatgenerator_0_tvbh_1
      - sensor.rocon_heatgenerator_0_buffer_temperature_actual
      - sensor.rocon_heatgenerator_0_n
      - sensor.rocon_heatgenerator_0_v
      - sensor.rocon_heatgenerator_0_water_pressure
