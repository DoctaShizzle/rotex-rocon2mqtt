          const barrierIndex=time=>{let lo=0,hi=barriers.length-1,index=-1;while(lo<=hi){const mid=(lo+hi)>>1;if(barriers[mid]<=time){index=mid;lo=mid+1;}else hi=mid-1;}return index;};
