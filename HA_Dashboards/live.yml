                          local(t){const d=new Date(t);return new Date(t-d.getTimezoneOffset()*60000).toISOString().slice(0,19);}
                          renderEvents(){this.$('list').replaceChildren();for(const event of this._events){const details=document.createElement('details');const summary=document.createElement('summary');const label=document.createElement('span');label.textContent=event.name+' ('+event.confidence+', afgeleid) · '+this.date(event.start)+' → '+new Date(event.end).toLocaleTimeString('nl-BE');const duration=document.createElement('span');duration.className='duration';duration.textContent=Math.floor((event.end-event.start)/60000)+' min '+Math.floor((event.end-event.start)%60000/1000)+' s';summary.append(label,duration);details.append(summary);const why=document.createElement('p');why.className='sub';why.textContent=event.reasons.join(' · ');details.append(why);const c=document.createElement('div');c.className='controls';c.innerHTML='<div class="limits"><span></span><span></span></div><input type="range" aria-label="Tijdstip binnen pompcyclus"><div class="row"><button type="button">▶ Afspelen</button><label>Tijdstip <input type="datetime-local" step="1" aria-label="Historisch tijdstip"></label><label>Snelheid <select aria-label="Afspeelsnelheid"><option value="1">1×</option><option value="10">10×</option><option value="60" selected>60×</option></select></label></div><p class="selection"></p>';details.append(c);this.$('list').append(details);const range=c.querySelector('input[type=range]'),date=c.querySelector('input[type=datetime-local]'),play=c.querySelector('button'),speed=c.querySelector('select'),note=c.querySelector('.selection');c.querySelector('.limits span').textContent=new Date(event.start).toLocaleTimeString('nl-BE');c.querySelectorAll('.limits span')[1].textContent=new Date(event.end).toLocaleTimeString('nl-BE');range.min=String(event.start);range.max=String(event.end);range.step='1000';range.value=String(event.start);date.min=this.local(event.start);date.max=this.local(event.end);date.value=this.local(event.start);event.controls={range,date,play,speed,note,deta