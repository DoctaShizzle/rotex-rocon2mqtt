            let name='Thermische activiteit',reason='Temperatuurstijging; route onvoldoende bekend',routeKnown=false;
            if(d>=80){name='DHW';reason=tankHeating?'Warmwatervat warmt op; DHW-klep ≥ 80%':'Water warmt op; DHW-klep ≥ 80%';routeKnown=true;}
            else if(d<=20&&b<=20){name='Woning';reason='Water warmt op; DHW- en bypassklep ≤ 20%';routeKnown=true;}
            else if(d<=20&&b>=80){name='Bypass / opwarming';reason='Water warmt op; bypassklep ≥ 80%';routeKnown=true;}
            else if(Number.isFinite(d)&&Number.isFinite(b)){name=d>20?'Gemengd DHW / woning':'Gemengd woning / bypass';reason='Temperatuurstijging met tussenstand van de kleppen';routeKnown=true;}
            const corroborated=tankHeating&&waterHeating||supplyRise>=0.5&&returnRise>=0.3;
            const confidence=routeKnown&&corroborated?'waarschijnlijk':'onzeker';
