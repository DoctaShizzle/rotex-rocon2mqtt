                          async select(event,time){this._selected=event;const generation=++this._generation;time=Math.max(event.start,Math.min(event.end,time));event.time=time;const c=event.controls;c.range.value=String(time);c.date.value=this.local(time);this.$('modeText').textContent='◷ '+(event.inferred?'Afgeleid: '+event.name+' · ':'Historiek · ')+this.date(time);this.shadowRoot.querySelector('.mode').classList.add('history');this.$('live').hidden=false;c.note.textContent='Historische metingen laden…';const ids=this.config.schema.elements.filter(e=>e.type==='state-label').map(e=>e.entity);try{if(!this._data.has(event.start)){const data=await this.history(ids,event.start,event.end+1000);this._data.set(event.start,data);}if(generation!==this._generation||this._selected!==event)return;const data=this._data.get(event.start),states={...this._hass.states};let missing=0;for(const id of ids){const rows=data[id]||[];let lo=0,hi=rows.length-1,last=null;while(lo<=hi){const mid=(lo+hi)>>1;if(rows[mid].time<=time){last=rows[mid];lo=mid+1;}else hi=mid-1;}const value=last?last.state:'unavailable';if(!last||['unknown','unavailable','none'].includes(value))missing++;states[id]={...(states[id]||{entity_id:id,attributes:{}}),state:value,last_changed:last?new Date(last.time).toISOString():new Date(time).toISOString(),last_updated:last?new Date(last.time).toISOString():new Date(time).toISOString()};}const snapshot={...this._hass,states};if(this.child){const historical=this.historicalSchema(states),signature=JSON.stringify(historical);if(signature!==this._historicalSignature){this.child.setConfig(historical);this._historicalSignature=signature;}this.child.hass=snapshot;}c.note.textContent='Stroming en activiteit zijn afgeleid; n en V bepalen deze animatie niet. Laatst geregistreerde meting op of vóór '+this.date(time)+'.'+(missing?' '+missing+' sensorwaarde(n) ontbreken; bij onbekende klepstanden wordt geen stromingsroute aangenomen.':'');}catch(e){if(generation===this._generation)c.note.textContent='Historische metingen konden niet laden: '+e.message;}}
                          historicalSchema(states){const schema=JSON.parse(JSON.stringify(this.config.schema));const n=id=>{const v=states['sensor.rocon_heatgenerator_0_'+id]?.state;return v!==''&&Number.isFinite(Number(v))?Number(v):NaN;};const running=this._selected?.source==='thermal'?this._selected.time<this._selected.end:n(this._selected?.source==='V'?'v':'n')>0,d=n('valve_ch_dhw')/100,b=n('valve_ch_bypass')/100;const known=Number.isFinite(d)&&Number.isFinite(b),D=Math.min(1,Math.max(0,d)),B=Math.min(1,Math.max(0,b));let vars='--dhw-position:'+(Number.isFinite(D)?26+2*D:26)+'%;--bypass-position:'+(Number.isFinite(B)?60+2*B:60)+'%;--dhw-animation:none;--bypass-animation:none;--pump-state:'+(running?'running':'paused')+';--upm3-running:'+(running?1:0)+';--upm3-static:'+(running?0:1)+';--upm3-running-animation:none;--upm3-static-animation:none;';const flows={'common':running?1:0,'dhw-ch':known&&running?1-D:0,'dhw-tank':known&&running?D:0,'heating':known&&running?1-B:0,'bypass':known&&running?B:0,'common-hot':known&&running?B*(1-D):0,'heating-cool':known&&running?D*(1-B):0,'bypass-cool':known&&running?D*B:0};for(const key in flows)vars+='--flow-'+key+':'+flows[key]+';--test-'+key+':none;';schema.card_mod={style:'ha-card {container-type:inline-size;max-width:740px;margin:auto;border:none;background:white;} :host {'+vars+'}'};for(const e of schema.elements){e.tap_action={action:'none'};e.hold_action={action:'none'};if(e.type==='state-label'&&e.card_mod?.style){let css=e.card_mod.style;css=css.replace(/{%[\s\S]*?%}/g,'').replace(/{{[\s\S]*?}}/g,'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Ccircle%20cx%3D%228%22%20cy%3D%228%22%20r%3D%223.5%22%20fill%3D%22%2389949c%22%2F%3E%3C%2Fsvg%3E');e.card_mod={style:css};}if(e.title==='Driewegklep DHW'&&!Number.isFinite(d))e.style.opacity=0.25;if(e.title==='Driewegklep bypass'&&!Number.isFinite(b))e.style.opacity=0.25;}return schema;}
